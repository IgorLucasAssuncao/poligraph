name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  dotnet:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Só os unitários. Os de integração sobem UM container Postgres POR TESTE
      # (BaseIntegracao : IAsyncLifetime, e o xUnit instancia por método), o que o
      # runner do GitHub não aguenta. Rodam localmente: `dotnet test`.
      - name: Testes unitários
        run: dotnet test --no-build -c Release --filter "FullyQualifiedName~Unidade"

  migration:
    name: Migration gera script válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # Sem isto o `dotnet ef` morre com NETSDK1004: ele lê metadados do projeto e
      # precisa do project.assets.json, que só existe depois do restore.
      - name: Restore
        run: dotnet restore

      # Gera e valida. Não aplica: quem aplica é um container dentro do VPS.
      - name: Gerar script idempotente
        run: dotnet ef migrations script --idempotent -p src/Poligraph.Migrations -o migration.sql

      - uses: actions/upload-artifact@v4
        with:
          name: migration-sql
          path: migration.sql

  python:
    name: ETL Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: pip install -r src/etl/requirements-dev.txt

      - name: Testes
        run: pytest -q
        working-directory: src/etl

  web:
    name: Front React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm run build
        working-directory: src/web

  qualidade:
    name: Qualidade de código
    runs-on: ubuntu-latest

    # env do JOB: o contexto `env` só chega ao `if` de um passo assim.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJETO: IgorLucasAssuncao_poligraph
      SONAR_ORG: igorlucasassuncao

    steps:
      - name: Aviso quando o segredo não existe
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=Sonar não rodou::SONAR_TOKEN ausente — nada foi analisado."

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          java-version: '21'
          distribution: zulu

      - uses: actions/setup-dotnet@v4
        if: env.SONAR_TOKEN != ''
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        if: env.SONAR_TOKEN != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Cache do Sonar
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Instalar o scanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Cobertura do ETL
        if: env.SONAR_TOKEN != ''
        working-directory: src/etl
        run: |
          pip install -r requirements-dev.txt
          pytest -q --cov=poligraph_etl --cov-report=xml

      - name: Cobertura do front
        if: env.SONAR_TOKEN != ''
        working-directory: src/web
        run: |
          npm ci
          npm test -- --coverage --coverage.reporter=lcov

      - name: Analisar
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJETO" \
            /o:"$SONAR_ORG" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="src/etl/coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="src/web/coverage/lcov.info" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,src/web/dist/**,src/Poligraph.Migrations/Migrations/**" \
            /d:sonar.test.inclusions="src/etl/tests/**,**/*.test.ts,**/*.test.tsx"

          dotnet build -c Release
          dotnet test --no-build -c Release --filter "FullyQualifiedName~Unidade" --collect:"XPlat Code Coverage;Format=opencover"

          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker:
    name: Imagens constroem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem da API
        run: docker build -f docker/Dockerfile.api -t poligraph-api:ci .

      - name: Build da imagem de migrations
        run: docker build -f docker/Dockerfile.migrations -t poligraph-migrations:ci .

      - name: Build da imagem do ETL
        run: docker build -f docker/Dockerfile.etl -t poligraph-etl:ci .

      - name: Build da imagem do front
        run: docker build -f docker/Dockerfile.web -t poligraph-web:ci .
