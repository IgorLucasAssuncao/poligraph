server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Não diz a versão do nginx no cabeçalho nem na página de erro.
    server_tokens off;

    # Cabeçalhos de segurança, em toda resposta (OWASP A05, auditoria de 2026-10-03).
    # A CSP libera só o que o site usa: o próprio site; o login do Google (script, estilo,
    # quadro e chamada); o Clarity, depois do consentimento; e as fotos oficiais da Câmara
    # e do Senado, que o service worker busca. style-src precisa de 'unsafe-inline' porque
    # o React escreve largura de barra e posição de balão no atributo style.
    # HSTS fica no Cloudflare, que termina o TLS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br https://*.googleusercontent.com https://*.clarity.ms; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/ https://*.clarity.ms https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br; frame-src https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # /api vai para o container da API, na mesma origem: sem CORS com credenciais, e o
    # cookie pode ser SameSite=Lax.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome não mudam: cache longo. O add_header de um location
    # substitui os do server, por isso os de segurança são repetidos aqui.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br https://*.googleusercontent.com https://*.clarity.ms; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/ https://*.clarity.ms https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br; frame-src https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
