# Duas cópias da API (decisão do autor, 2026-10-15), serviços api e api2 do compose. O nginx divide as
# visitas entre elas e, se uma não responde, manda para a outra.
# DECISÃO: os endereços são resolvidos uma vez, ao subir. O site sobe depois das duas (depends_on),
#    e todo deploy recria os containers juntos. A consulta contínua ao DNS ("resolve") não foi usada:
#    no teste, o resolvedor do nginx não alcançou o DNS do Podman, e falhando no servidor derrubaria
#    a API inteira.
# ATENÇÃO: "zone" divide entre os processos do nginx a vez de cada cópia. Sem ela, cada processo
#    começa pela primeira, e no teste todas as visitas foram para a mesma (2026-10-15).
upstream apis {
    zone apis 64k;
    server api:8080 max_fails=2 fail_timeout=10s;
    server api2:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Não diz a versão do nginx no cabeçalho nem na página de erro.
    server_tokens off;

    # Um endereço só (2026-10-18): o www volta para o domínio sem www. Para o navegador, os dois são
    # sites diferentes, cada um com o seu armazenamento e o seu cookie: a escolha do aviso de medição
    # feita num não valia no outro, e a pessoa entrava de novo. MEDIDO: www respondia 200 direto.
    if ($host = www.registroaberto.org) {
        return 301 https://registroaberto.org$request_uri;
    }

    # Cabeçalhos de segurança, em toda resposta (OWASP A05, auditoria de 2026-10-03).
    # A CSP libera só o que o site usa: o próprio site; o login do Google (script, estilo,
    # quadro e chamada); o Clarity, depois do consentimento; e as fotos oficiais da Câmara
    # e do Senado, que o service worker busca; as estatísticas sem cookie da Cloudflare (Web Analytics),
    # que ela injeta na página (decisão do autor, 2026-10-15). style-src precisa de 'unsafe-inline' porque
    # o React escreve largura de barra e posição de balão no atributo style.
    # HSTS fica no Cloudflare, que termina o TLS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://www.clarity.ms https://*.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br https://*.googleusercontent.com https://*.clarity.ms; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/ https://*.clarity.ms https://cloudflareinsights.com https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br; frame-src https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # /api vai para o container da API, na mesma origem: sem CORS com credenciais, e o
    # cookie pode ser SameSite=Lax.
    location /api/ {
        proxy_pass http://apis;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome não mudam: cache longo. O add_header de um location
    # substitui os do server, por isso os de segurança são repetidos aqui.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://www.clarity.ms https://*.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br https://*.googleusercontent.com https://*.clarity.ms; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/ https://*.clarity.ms https://cloudflareinsights.com https://www.camara.leg.br https://legis.senado.leg.br https://www.senado.leg.br; frame-src https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
